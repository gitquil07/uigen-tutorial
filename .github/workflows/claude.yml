name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Project setup
        run: |
          npm run setup
          npm run dev:daemon

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          custom_instructions: |
            The project is already set up with all dependencies installed.
            The server is already running at localhost:3000. Logs from it
            are being written to logs.txt. If needed, you can query the db
            with the 'sqlite3' cli. If needed, use the mcp_playwright
            set of tools to launch a browser and interact with the app.
          
          mcp_config: |
            {
              "mcpServers": {
                "playwright": {
                  "command": "npx",
                  "args": [
                    "@playwright/mcp@latest",
                    "--allowed-origins",
                    "localhost:3000;cdn.tailwindcss.com;esm.sh"
                  ]
                }
              }
            }

          allowed_tools: "Bash(npm:*),Bash(sqlite3:*),mcp_playwright_browser_snapshot,mcp_playwright_browser_click,mcp_playwright_browser_navigate,mcp_playwright_browser_navigate_back,mcp_playwright_browser_navigate_forward,mcp_playwright_browser_type,mcp_playwright_browser_hover,mcp_playwright_browser_select_option,mcp_playwright_browser_drag,mcp_playwright_browser_press_key,mcp_playwright_browser_scroll,mcp_playwright_browser_wait_for_page_state,mcp_playwright_browser_file_upload,mcp_playwright_browser_handle_dialog,mcp_playwright_browser_take_screenshot,mcp_playwright_browser_pdf_save,mcp_playwright_browser_network_requests,mcp_playwright_browser_console_messages,mcp_playwright_browser_generate_playwright_test,mcp_playwright_browser_tab_new,mcp_playwright_browser_tab_list,mcp_playwright_browser_tab_select,mcp_playwright_browser_tab_close,mcp_playwright_browser_close,mcp_playwright_browser_resize,mcp_playwright_browser_wait"